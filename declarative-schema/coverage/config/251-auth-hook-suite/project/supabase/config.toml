# Safety: this fixed ID addresses only the runner-owned local Supabase stack.
project_id = "ds-shared-runtime"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55000
shadow_port = 55100
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/hook_access_token_251"

[auth.hook.mfa_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/hook_mfa_attempt_251"

[auth.hook.password_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/hook_password_attempt_251"

[auth.hook.send_sms]
enabled = true
uri = "pg-functions://postgres/public/hook_send_sms_251"

[studio]
enabled = false

[inbucket]
enabled = false

[analytics]
enabled = false
